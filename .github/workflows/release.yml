name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y reprepro createrepo-c rpm pacman-package-manager
          curl -fsSL https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_x86_64.tar.gz | sudo tar -xz -C /usr/local/bin nfpm
      - name: Build packages
        env:
          APK_SIGNING_KEY_FILE: ${{ runner.temp }}/pkgrepo.rsa
        run: |
          printf '%s' "${{ secrets.ALPINE_PRIVATE_KEY }}" > "$APK_SIGNING_KEY_FILE"
          scripts/build-config-deb.sh
          scripts/build-packages.sh
      - name: Import GPG key and publish indexes
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          ALPINE_KEY: ${{ runner.temp }}/pkgrepo.rsa
          APK_PUBLIC_KEY: keys/pkgrepo.rsa.pub
        run: |
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          scripts/publish.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://poko.kshitizwagle.com.np
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
