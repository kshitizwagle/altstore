name: release
on:
  push:
    tags: ["v*"]
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y reprepro createrepo-c rpm pacman-package-manager
          curl -fsSL https://github.com/goreleaser/nfpm/releases/download/v2.48.0/nfpm_2.48.0_Linux_x86_64.tar.gz | sudo tar -xz -C /usr/local/bin nfpm
      - name: Build packages
        env:
          APK_SIGNING_KEY_FILE: ${{ runner.temp }}/pkgrepo.rsa
        run: |
          printf '%s' "${{ secrets.ALPINE_PRIVATE_KEY }}" > "$APK_SIGNING_KEY_FILE"
          scripts/build-packages.sh
      - name: Import GPG key and publish indexes
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          ALPINE_KEY: ${{ runner.temp }}/pkgrepo.rsa
          APK_PUBLIC_KEY: keys/pkgrepo.rsa.pub
        run: |
          printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
          scripts/publish.sh
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/
